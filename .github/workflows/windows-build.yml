name: Build Windows app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv\Scripts\python.exe -m pip install -e .
      - run: ./scripts/build-windows.ps1
        shell: pwsh
      - run: dist\CZSK-Trendfinder\CZSK-Trendfinder.exe demo --data-dir data/exe-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: CZSK-Trendfinder-Windows
          path: dist/CZSK-Trendfinder/
